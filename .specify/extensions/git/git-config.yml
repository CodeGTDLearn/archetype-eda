# Git Branching Workflow Extension Configuration
# Copied to .specify/extensions/git/git-config.yml on install

# Branch numbering strategy: "sequential" (001, 002, ...) or "timestamp" (YYYYMMDD-HHMMSS)
branch_numbering: sequential

# Optional branch name template. Leave empty for the default "{number}-{slug}".
# Supported tokens: {author}, {app}, {number}, {slug}
# {slug} must not appear before {number}; final path segment must start with {number}-.
# Example for monorepos: "{author}/{app}/{number}-{slug}"
branch_template: ""

# Optional shorthand namespace. Leave empty to use branch_template/default behavior.
# Example: "features/{app}" expands to "features/{app}/{number}-{slug}"
branch_prefix: ""

# Commit message used by `git commit` during repository initialization
init_commit_message: "[Spec Kit] Initial commit"

# Commit message style used by auto-commit hooks (speckit.git.commit):
# "fixed"        - default; use the configured/static messages below.
# "conventional" - ask the agent to inspect the diff and generate a
#                  Conventional Commit message (e.g. "feat: add OAuth spec")
#                  instead of using the messages configured below.
# "snapshot"     - rollback snapshot taken by before_* hooks: the script
#                  classifies the frozen phase from the staged diff and
#                  builds title + body (synopsis, "Concluído", next phase,
#                  --stat). Title format:
#                  "📸 <fase>: "<assunto>" (<detalhes>)", where <assunto>
#                  comes from the agent via -TitleFile (falls back to a
#                  per-phase default) and <detalhes> are automatic metrics
#                  (Implement: "N arquivos - T012–T015"; Tasks: "N tarefas
#                  em M fases"; Plan: "N artefatos de design"; Checklist:
#                  "N listas"; Specify/Snapshot: omitted). The agent may
#                  refine the synopsis via -SynopsisFile. The static
#                  messages below are ignored.
commit_style: snapshot

# Prefixo do título dos snapshots (📸). Fora do script de propósito:
# o auto-commit.ps1 é lido pelo PowerShell 5.1 como ANSI quando não tem BOM,
# e o git-config.yml é lido com -Encoding UTF8.
snapshot_prefix: "📸"

# Auto-commit before/after core commands.
# Set "default" to enable for all commands, then override per-command.
# Each key can be true/false. Message is customizable per-command.
auto_commit:
  default: false
  before_clarify:
    enabled: false
    message: "[Spec Kit] Save progress before clarification"
  before_plan:
    enabled: false
    message: "[Spec Kit] Save progress before planning"
  before_tasks:
    enabled: false
    message: "[Spec Kit] Save progress before task generation"
  before_implement:
    enabled: false
    message: "[Spec Kit] Save progress before implementation"
  before_checklist:
    enabled: false
    message: "[Spec Kit] Save progress before checklist"
  before_analyze:
    enabled: false
    message: "[Spec Kit] Save progress before analysis"
  before_converge:
    enabled: false
    message: "[Spec Kit] Save progress before convergence"
  before_taskstoissues:
    enabled: false
    message: "[Spec Kit] Save progress before issue sync"
  after_constitution:
    enabled: false
    message: "Constitution - ✅ - principles updated"
  after_specify:
    enabled: true
    message: "Specify - ✅ - scope defined"
  after_clarify:
    enabled: true
    message: "Clarify - ✅ - ambiguities resolved"
  after_plan:
    enabled: true
    message: "Plan - ✅ - approach defined"
  after_tasks:
    enabled: true
    message: "Tasks - ✅ - breakdown recorded"
  after_implement:
    enabled: true
    message: "Implement - ✅ - changes applied"
  after_checklist:
    enabled: true
    message: "Checklist - ✅ - criteria verified"
  after_analyze:
    enabled: true
    message: "Analyze - ✅ - consistency verified"
  after_converge:
    enabled: true
    message: "Converge - ✅ - convergence assessed"
  after_taskstoissues:
    enabled: true
    message: "Task2Issues - ✅ - issues synced"
