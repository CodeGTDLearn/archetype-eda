# Git Branching Workflow Extension Configuration
# Copied to .specify/extensions/git/git-config.yml on install

# Branch numbering strategy: "sequential" (001, 002, ...) or "timestamp" (YYYYMMDD-HHMMSS)
branch_numbering: sequential

# Optional branch name template. Leave empty for the default "{number}-{slug}".
# Supported tokens: {author}, {app}, {number}, {slug}
# {slug} must not appear before {number}; final path segment must start with {number}-.
# Example for monorepos: "{author}/{app}/{number}-{slug}"
branch_template: ""

# Optional shorthand namespace. Leave empty to use branch_template/default behavior.
# Example: "features/{app}" expands to "features/{app}/{number}-{slug}"
branch_prefix: ""

# Commit message used by `git commit` during repository initialization
init_commit_message: "[Spec Kit] Initial commit"

# Commit message style used by auto-commit hooks (speckit.git.commit):
# "fixed"        - use the configured/static messages below.
# "conventional" - ask the agent to inspect the diff and generate a
#                  Conventional Commit message (e.g. "feat: add OAuth spec")
#                  instead of using the messages configured below.
# "snapshot"     - commit taken by a speckit.git.commit hook: an after_* hook
#                  states the phase that just finished (authoritative), while a
#                  before_* hook freezes the previous phase's state. The event
#                  narrows the candidates and the staged diff picks the most
#                  advanced one present. Title format:
#                  "📸 <fase>: "<assunto>" (<detalhes>)", where <assunto>
#                  comes from the agent via --title-file / -TitleFile
#                  (falls back to a per-phase default) and <detalhes> are
#                  automatic metrics (Implement: "N arquivos - T012–T015";
#                  Tasks: "N tarefas em M fases"; Plan: "N artefatos de
#                  design"; Checklist: "N listas"; Clarify: "N sessões";
#                  Analyze: "analysis.md"; Constitution: "constitution.md";
#                  Converge/Task2Issues/Specify/Snapshot: omitted). The agent
#                  may refine the synopsis via --synopsis-file / -SynopsisFile.
#                  The static messages below are ignored in this mode.
commit_style: snapshot

# Prefix of the snapshot title (camera emoji). Read as UTF-8 by the hooks.
snapshot_prefix: "📸"

# Auto-commit before/after core commands.
# Set "default" to enable for all commands, then override per-command.
# Each key can be true/false. Message is customizable per-command.
auto_commit:
  default: false
  before_clarify:
    enabled: false
    message: "[Spec Kit] Save progress before clarification"
  before_plan:
    enabled: false
    message: "[Spec Kit] Save progress before planning"
  before_tasks:
    enabled: false
    message: "[Spec Kit] Save progress before task generation"
  before_implement:
    enabled: false
    message: "[Spec Kit] Save progress before implementation"
  before_checklist:
    enabled: false
    message: "[Spec Kit] Save progress before checklist"
  before_analyze:
    enabled: false
    message: "[Spec Kit] Save progress before analysis"
  before_converge:
    enabled: false
    message: "[Spec Kit] Save progress before convergence"
  before_taskstoissues:
    enabled: false
    message: "[Spec Kit] Save progress before issue sync"
  after_constitution:
    enabled: false
    message: "[Spec Kit] Add project constitution"
  after_specify:
    enabled: true
    message: "[Spec Kit] Add specification"
  after_clarify:
    enabled: true
    message: "[Spec Kit] Clarify specification"
  after_plan:
    enabled: true
    message: "[Spec Kit] Add implementation plan"
  after_tasks:
    enabled: true
    message: "[Spec Kit] Add tasks"
  after_implement:
    enabled: true
    message: "[Spec Kit] Implementation progress"
  after_checklist:
    enabled: true
    message: "[Spec Kit] Add checklist"
  after_analyze:
    enabled: true
    message: "[Spec Kit] Add analysis report"
  after_converge:
    enabled: true
    message: "[Spec Kit] Assess convergence"
  after_taskstoissues:
    enabled: true
    message: "[Spec Kit] Sync tasks to issues"
