input {
      tcp {
          port => 5000  #Logback-spring: LogstashTcpSocketAppender
          codec => json #Logback-spring: LoggingEventCompositeJsonEncoder
      }
}

output {
    elasticsearch {
        hosts => "elasticsearch:9200" # 'Elasticsearch Service do compose'  + Standard Port 9200
        index => "springboot-%{app}"
    }
}

# 1) O App envia os logs p/ (logstash.conf: "INPUT"), via APPENDER-TCP-LOGSTASH "<destination>", do Logback-spring.xml
# 2) O Logstasch (logstash.conf: "OUTPUT") envia os 'Logs Processados' p/ 'elasticsearch:9200'
# 3) O kibana exibe os Logs recebidos do 'elasticsearch:9200'