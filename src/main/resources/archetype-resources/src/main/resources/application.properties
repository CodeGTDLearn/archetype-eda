##
## CONFIGURATION PROPERTIES - BINDING PROPERTIES _______________________________
#if($bindProps == "true" && $listProps == "true" && $mapProps == "false")
spring.config.import=${properties_folder}/application_list.properties
#end
#if($bindProps == "true" && $listProps == "false" && $mapProps == "true")
spring.config.import=${properties_folder}/application_map.properties
#end
#if($bindProps == "true" && $listProps == "true" && $mapProps == "true")
# ATTENTION:
# - Only 'ONE PROPERTY' 'spring.config.import' can be used/enabled
# - If more than one 'spring.config.import' will be necessary, use: ',' or '\'
spring.config.import=\
${properties_folder}/application_map.properties,\
${properties_folder}/application_list.properties
#end

