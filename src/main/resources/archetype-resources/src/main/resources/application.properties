spring.application.name=Scaffold
spring.main.banner-mode=console
spring.output.ansi.enabled=always

encripted_credentials_vault_path=C:/WORKBASE/DEV/vault
encripted_credentials_file=scaffold-entity-project-gitignored-credentials.yml

properties_folder=classpath:properties
protected_properties_folder=classpath:protected_properties

# 'Relative Path' must be calculated FROM 'working-directory'(project root/folder)
spring.config.import=\
  \
  ${properties_folder}/logback_config.properties,\
  \
  file:${encripted_credentials_vault_path}/${encripted_credentials_file},\
  \
  ${protected_properties_folder}/dev_authentication_credentials.properties

#  ${properties_folder}/i18n_messages.properties,\

