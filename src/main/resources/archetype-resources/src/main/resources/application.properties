#set( $symbol_pound = '#' )
#set( $symbol_dollar = '$' )
#set( $symbol_escape = '\' )
spring.application.name=${artifactId}
spring.application.version=${version}

spring.main.banner-mode=console
spring.output.ansi.enabled=always

properties_folder=classpath:properties
protected_properties_folder=classpath:protected_properties

# 'Relative Path' must be calculated FROM 'working-directory'(project root/folder)
spring.config.import=${protected_properties_folder}/application_keys.properties
spring.config.import=${protected_properties_folder}/admin_credentials.properties
spring.config.import=${protected_properties_folder}/authentication_credentials.properties

#if(${enable_binding_properties} == "true" and ${list_binding_properties} == "true")
spring.config.import=${properties_folder}/application_list.properties
#end
#if(${enable_binding_properties} == "true" and ${map_binding_properties} == "true")
spring.config.import=${properties_folder}/application_map.properties
#end

#if(${enable_folder_src_test_java} == "true")
${symbol_pound}spring.datasource.url=jdbc:h2:mem:testdb
${symbol_pound}spring.datasource.driverClassName=org.h2.Driver
${symbol_pound}spring.datasource.username=sa
${symbol_pound}spring.datasource.password=password
${symbol_pound}spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
${symbol_pound}spring.h2.console.enabled=true
#end

#if(${enable_security_authentication_support} == "true")
${symbol_pound} Evitar usar 'classpath', dar preferencia a servicos de CloudSecuritySecrets 
jwt.private.key=classpath:app.key
jwt.public.key=classpath:app.pub
#end