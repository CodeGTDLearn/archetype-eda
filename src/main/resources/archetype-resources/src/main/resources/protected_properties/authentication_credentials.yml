##
## YAML mirror of authentication_credentials.properties (same keys, relaxed
## binding). Required because config_file_format=2 removes every .properties
## file: the JWT + YAML mode must be self-sufficient.
## See application.yml JWT import block.
##
authentication:
  credentials:
    user1ID: 99
    unknownUser: xxxxxx
    user1name: sarah1
    userNameNoOwner: hank-owns-no-cards
    user1password: ${SECRET_USER1_PASSWORD}
    unknownPassword: ${SECRET_UNKNOWN_PASSWORD}
    userPasswordNoOwner: ${SECRET_USER_PASSWORD_NO_OWNER}
