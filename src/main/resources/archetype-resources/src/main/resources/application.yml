#set( $symbol_pound = '#' )
#set( $symbol_dollar = '$' )
#set( $symbol_escape = '\' )
properties_folder: classpath:properties
protected_properties_folder: classpath:protected_properties

server:
  port: ${api_port}

spring:
  application:
    name: ${artifactId}
    version: ${version}
  main:
    banner-mode: console
  output:
    ansi:
      enabled: always
  config:
    import:
      - ${protected_properties_folder}/application_keys.yml
      - ${protected_properties_folder}/admin_credentials.yml
      - ${protected_properties_folder}/authentication_credentials.yml
#if(${enable_binding_properties} == "true" and ${list_binding_properties} == "true")
      - ${properties_folder}/application_list.yml
#end
#if(${enable_binding_properties} == "true" and ${map_binding_properties} == "true")
      - ${properties_folder}/application_map.yml
#end