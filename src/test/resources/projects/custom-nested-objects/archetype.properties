# Integration-test profile: NESTED contract objects (FR-021).
#
# The values below are EXACTLY what the LLM inference mechanism derives from
# sample-contract.json:
#   entity_name              = Cliente
#   entity_name_package      = cliente
#   enable_custom_attributes = true
#   custom_attributes_list   = String:nome,Endereco:endereco
#   custom_nested_type_definitions =
#       Endereco|logradouro:String,numero:Integer,complemento:Complemento;Complemento|descricao:String
#
# The entity references the nested POJO by its FULLY QUALIFIED name; the POJO
# lives in the 'nested' subpackage of the entity. The entity marks the nested
# field @Transient, and the nested POJO is a plain class (no Lombok, no JPA).
package=it.pkg
version=0.1-SNAPSHOT
groupId=archetype.it
artifactId=custom-nested-objects
project_description=Nested contract objects scenario
java_version=17
api_port=8080
enable_git_support=false
entity_name=Cliente
entity_name_package=cliente
enable_custom_attributes=true
custom_attributes_list=String:nome,Endereco:endereco
custom_nested_type_definitions=Endereco|logradouro:String,numero:Integer,complemento:Complemento;Complemento|descricao:String
custom_attribute_imports=none
custom_enum_definitions=none
enable_lombok=false
enable_docker=false
properties_filetype=1
enable_binding_properties=false
default_binding_properties=false
list_binding_properties=false
map_binding_properties=false
enable_binding_properties_tests=false
mutable_binding_properties=false
validated_binding_properties=false
enable_logback=false
logback_console_type=1
enable_logback_appender_smtp=false
enable_logback_appender_file=false
enable_api_cpanel=false
enable_api_cpanel_elk_log_system=false
enable_jwt_authentication=false
show_archetype_pos_processor_log=true
extra_POM_dependencies=false
enable_folder_src_test_java=true
language=pt
project_language=pt
