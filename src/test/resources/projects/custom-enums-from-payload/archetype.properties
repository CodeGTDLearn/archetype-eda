# Integration-test profile: ENUMS derived from a PURE PAYLOAD (FR-021).
#
# The values below are EXACTLY what the LLM inference mechanism derives from
# sample-contract.json (flat payload):
#   entity_name              = Pedido
#   entity_name_package      = pedido
#   enable_custom_attributes = true
#   custom_attributes_list   = Integer:id,String:name,Status:status,Endereco:endereco
#   custom_nested_type_definitions = Endereco|uf:Uf
#   custom_enum_definitions  = Status:ATIVO|CANCELADO;nested.Uf:SP|RJ
#   custom_attribute_imports = none
#
# Exercised rules:
#   - a TOP-LEVEL array of UPPERCASE strings is an enum (Status, entity package);
#   - a NESTED field array of UPPERCASE strings is an enum (Uf, nested package,
#     selected by the relative "nested." marker of custom_enum_definitions);
#   - the top-level enum lives in the entity package (no import);
#   - the nested POJO references the nested enum by its simple name;
#   - the nested POJO itself is referenced by FQN and marked @Transient.
package=it.pkg
version=0.1-SNAPSHOT
groupId=archetype.it
artifactId=custom-enums-from-payload
project_description=Enums derived from a pure payload
java_version=17
api_port=8080
enable_git_support=false
entity_name=Pedido
entity_name_package=pedido
enable_custom_attributes=true
enable_lombok=false
custom_attributes_list=Integer:id,String:name,Status:status,Endereco:endereco
custom_nested_type_definitions=Endereco|uf:Uf
custom_enum_definitions=Status:ATIVO|CANCELADO;nested.Uf:SP|RJ
custom_attribute_imports=none
enable_docker=false
properties_filetype=1
enable_binding_properties=false
default_binding_properties=false
list_binding_properties=false
map_binding_properties=false
enable_binding_properties_tests=false
mutable_binding_properties=false
validated_binding_properties=false
enable_logback=false
logback_console_type=1
enable_logback_appender_smtp=false
enable_logback_appender_file=false
enable_api_cpanel=false
enable_api_cpanel_elk_log_system=false
enable_jwt_authentication=false
show_archetype_pos_processor_log=true
extra_POM_dependencies=false
enable_folder_src_test_java=true
language=pt
project_language=pt
