# Integration-test profile: FR-021 - contract persistence.
#
# The values below are EXACTLY what the LLM inference mechanism derives from
# sample-contract.json (see ContractDerivationTest.groovy):
#   entity_name            = ContractEntity        (contract field entityName)
#   entity_name_package    = contractentity        (derived from entity_name)
#   enable_custom_attributes = true                (forced by the attributes)
#   custom_attributes_list = Integer:id,String:name,Boolean:active
#                            (type estimated from the VALUE of each attribute)
#
# entity_contract_path points to the contract file the mechanism materializes;
# the post-processor must copy it into the generated project at
# src/test/resources/contracts/contract.json.
#
# The path is relative to the working directory of the generation (the
# archetype project root), so it resolves in the integration test.
package=it.pkg
version=0.1-SNAPSHOT
groupId=archetype.it
artifactId=entity-contract
project_description=Contract persistence scenario
java_version=17
api_port=8080
enable_git_support=false
entity_name=ContractEntity
entity_name_package=contractentity
enable_custom_attributes=true
custom_attributes_list=Integer:id,String:name,Boolean:active
entity_contract_path=src/test/resources/projects/entity-contract/sample-contract.json
enable_lombok=false
enable_docker=false
properties_filetype=1
enable_binding_properties=false
default_binding_properties=false
list_binding_properties=false
map_binding_properties=false
enable_binding_properties_tests=false
mutable_binding_properties=false
validated_binding_properties=false
enable_logback=false
logback_console_type=1
enable_logback_appender_smtp=false
enable_logback_appender_file=false
enable_api_cpanel=false
enable_api_cpanel_elk_log_system=false
enable_jwt_authentication=false
show_archetype_pos_processor_log=true
extra_POM_dependencies=false
enable_folder_src_test_java=true
language=pt
project_language=pt
