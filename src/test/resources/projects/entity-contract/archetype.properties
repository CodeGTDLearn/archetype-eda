# ===========================================================================
# FIXTURE SIGNATURE -- derived by FixturesMatrixTest.groovy from archetype.properties
# SCENARIO : persistencia do contrato (FR-023) + schema test (Frente 01)
# CLUSTER  : contract
# FLAGS UNDER TEST (value != catalog default; identity/metadata excluded):
#   contract_enum_definitions=Status:ATIVO|CANCELADO;nested.Uf:SP|RJ
#   contract_nested_type_definitions=Endereco|logradouro:String,numero:Integer,uf:Uf,complemento:Complemento;Complemento|descricao:String,pontoReferencia:PontoReferencia;PontoReferencia|descricao:String,distanciaMetros:Integer,referencia:Referencia;Referencia|nome:String,origem:Origem;Origem|bairro:String,detalhe:Detalhe;Detalhe|codigo:String,observacao:String
#   custom_entity_attributes_list=Long:id,String:name,Boolean:active,Endereco:endereco,Status:status,String:tags,Status:previousStatus
#   enable_custom_entity_attributes=true
#   enable_folder_src_test_java=true
#   entity_contract_file_path=src/test/resources/projects/entity-contract/sample-contract.json
# ASSERTS  : contract.json byte-a-byte, entidade coerente, pacote contract/ presente,
#            schema test executado verde (surefire), sabotagem falha com diagnostico,
#            cadeia de 6 POJOs aninhados (7 niveis) e enums (topo + aninhado)
# ===========================================================================
# Integration-test profile: FR-023 (contract persistence) + the entity-contract
# schema test of the GENERATED application (Frente 01 / Frente 02).
#
# The values below are EXACTLY what the packaged procedure derives from
# sample-contract.json - utils/03-derivacao-regras-de-formacao-do-contrato/:
#   entity_name            = ContractEntity        (contract field entityName)
#   entity_package_name    = contractentity        (derived from entity_name)
#   enable_custom_entity_attributes = true                (forced by the attributes)
#   custom_entity_attributes_list = Long:id,String:name,Boolean:active,Endereco:endereco,Status:status,String:tags,Status:previousStatus
#                            (type estimated from the VALUE of each attribute; a project
#                             type over a non-enum array falls back to String, and two
#                             fields of the same enum type share one aggregated enum)
#   contract_nested_type_definitions = 6 nested POJOs in a chain (7 levels incl. the entity)
#   contract_enum_definitions = Status (top level) + nested.Uf (inside Endereco)
#
# entity_contract_file_path points to the contract file the mechanism materializes;
# the post-processor must copy it into the generated project at
# src/test/resources/contracts/contract.json.
package=it.pkg
version=0.1-SNAPSHOT
groupId=archetype.it
artifactId=entity-contract
project_description=Contract persistence and entity-contract schema test
java_version=17
api_port=8080
enable_git_support=false
entity_name=ContractEntity
entity_package_name=contractentity
enable_custom_entity_attributes=true
custom_entity_attributes_list=Long:id,String:name,Boolean:active,Endereco:endereco,Status:status,String:tags,Status:previousStatus
custom_entity_attribute_imports=none
contract_nested_type_definitions=Endereco|logradouro:String,numero:Integer,uf:Uf,complemento:Complemento;Complemento|descricao:String,pontoReferencia:PontoReferencia;PontoReferencia|descricao:String,distanciaMetros:Integer,referencia:Referencia;Referencia|nome:String,origem:Origem;Origem|bairro:String,detalhe:Detalhe;Detalhe|codigo:String,observacao:String
contract_enum_definitions=Status:ATIVO|CANCELADO;nested.Uf:SP|RJ
entity_contract_file_path=src/test/resources/projects/entity-contract/sample-contract.json
enable_lombok_support=false
enable_docker_support=false
config_file_format=1
enable_binding_external_properties=false
enable_default_binding_external_properties=false
enable_list_binding_external_properties=false
enable_map_binding_external_properties=false
enable_binding_external_properties_tests=false
binding_external_properties_mutability=none
enable_binding_external_properties_validation=false
enable_logback_support=false
logback_console_type=1
enable_logback_appender_smtp=false
enable_logback_appender_file=false
enable_api_cpanel_elk_log_system=false
enable_jwt_authentication=false
show_archetype_post_generate_log=true
extra_pom_dependencies=false
enable_folder_src_test_java=true
llm_prompt_language=pt
project_i18n_language=pt
