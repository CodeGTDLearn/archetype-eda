# Integration-test profile: NESTED contract objects - edge cases (FR-021).
#
# The values below are EXACTLY what the LLM inference mechanism derives from
# sample-contract.json:
#   entity_name              = Pedido
#   entity_name_package      = pedido
#   enable_custom_attributes = true
#   enable_lombok            = true
#   custom_attributes_list   = String:nome,PedidoType:pedido,Endereco:endereco
#   custom_nested_type_definitions =
#       PedidoType|uf:String;Endereco|class_:String,opcao:String,tags:String,pedidoAnterior:PedidoAnterior;PedidoAnterior|uf:String
#
# Exercised edge cases:
#   - the entity name is RESERVED: the nested object 'pedido' becomes PedidoType;
#   - a Java keyword field keeps the '_' suffix (class_);
#   - a non-ASCII key is ASCII-normalized (opção -> opcao);
#   - an array value becomes String (tags);
#   - an accented type key is ASCII-normalized (endereço -> Endereco);
#   - a nested POJO references another nested POJO (pedidoAnterior -> PedidoAnterior).
package=it.pkg
version=0.1-SNAPSHOT
groupId=archetype.it
artifactId=custom-nested-edge-cases
project_description=Nested contract objects edge cases
java_version=17
api_port=8080
enable_git_support=false
entity_name=Pedido
entity_name_package=pedido
enable_custom_attributes=true
enable_lombok=true
custom_attributes_list=String:nome,PedidoType:pedido,Endereco:endereco
custom_nested_type_definitions=PedidoType|uf:String;Endereco|class_:String,opcao:String,tags:String,pedidoAnterior:PedidoAnterior;PedidoAnterior|uf:String
custom_attribute_imports=none
custom_enum_definitions=none
enable_docker=false
properties_filetype=1
enable_binding_properties=false
default_binding_properties=false
list_binding_properties=false
map_binding_properties=false
enable_binding_properties_tests=false
mutable_binding_properties=false
validated_binding_properties=false
enable_logback=false
logback_console_type=1
enable_logback_appender_smtp=false
enable_logback_appender_file=false
enable_api_cpanel=false
enable_api_cpanel_elk_log_system=false
enable_jwt_authentication=false
show_archetype_pos_processor_log=true
extra_POM_dependencies=false
enable_folder_src_test_java=true
language=pt
project_language=pt
