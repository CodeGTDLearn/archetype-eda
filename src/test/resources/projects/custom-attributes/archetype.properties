package=it.pkg
version=0.1-SNAPSHOT
groupId=archetype.it
artifactId=custom-attributes
project_description=Custom attributes scenario
java_version=17
api_port=8080
enable_git_support=false
entity_name=ContractEntity
entity_name_package=contractentity
enable_custom_attributes=true
custom_attributes_list=Long:id,String:name,String:createdAt,StatusPedido:statusPedido,Situacao:situacao,AdminCredentials:adminCredentials
# FR-021 (PROJECT types): the referenced types are imported by the entity and
# the enums are generated by the post-processor.
#   - StatusPedido lives in another package (it.pkg.domain): the entity MUST
#     import it.
#   - Situacao lives in the package of the entity: the import MUST be omitted.
#   - AdminCredentials is an EXISTING class of the generated project: it is
#     referenced (and imported), never generated.
custom_attribute_imports=it.pkg.domain.StatusPedido,it.pkg.contractentity.Situacao,it.pkg.contractentity.config.properties.credentials.AdminCredentials
custom_enum_definitions=it.pkg.domain.StatusPedido:ATIVO|CANCELADO;it.pkg.contractentity.Situacao:ABERTA
# FR-021 (negative case): the contract is offered, but this profile keeps
# enable_folder_src_test_java=false, so the contracts folder MUST NOT be
# created in the generated project.
entity_contract_path=src/test/resources/projects/custom-attributes/sample-contract-for-archetype-test.json
enable_lombok=false
enable_docker=false
properties_filetype=1
enable_binding_properties=false
default_binding_properties=false
list_binding_properties=false
map_binding_properties=false
enable_binding_properties_tests=false
mutable_binding_properties=false
validated_binding_properties=false
enable_logback=false
logback_console_type=1
enable_logback_appender_smtp=false
enable_logback_appender_file=false
enable_api_cpanel=false
enable_api_cpanel_elk_log_system=false
enable_jwt_authentication=false
show_archetype_pos_processor_log=true
extra_POM_dependencies=false
enable_folder_src_test_java=false
language=pt
project_language=pt