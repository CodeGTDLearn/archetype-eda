package=it.pkg
version=0.1-SNAPSHOT
groupId=archetype.it
artifactId=custom-attributes
project_description=Custom attributes scenario
java_version=17
api_port=8080
enable_git_support=false
entity_name=ContractEntity
entity_package_name=contractentity
enable_custom_entity_attributes=true
custom_entity_attributes_list=Long:id,String:name,String:createdAt,StatusPedido:statusPedido,Situacao:situacao,AdminCredentials:adminCredentials
# FR-021 (PROJECT types): the referenced types are imported by the entity and
# the enums are generated by the post-processor.
#   - StatusPedido lives in another package (it.pkg.domain): the entity MUST
#     import it.
#   - Situacao lives in the package of the entity: the import MUST be omitted.
#   - AdminCredentials is an EXISTING class of the generated project: it is
#     referenced (and imported), never generated.
custom_entity_attribute_imports=it.pkg.domain.StatusPedido,it.pkg.contractentity.Situacao,it.pkg.contractentity.config.properties.credentials.AdminCredentials
contract_enum_definitions=it.pkg.domain.StatusPedido:ATIVO|CANCELADO;it.pkg.contractentity.Situacao:ABERTA
# FR-021 (negative case): the contract is offered, but this profile keeps
# enable_folder_src_test_java=false, so the contracts folder MUST NOT be
# created in the generated project.
entity_contract_file_path=src/test/resources/projects/custom-attributes/sample-contract-for-archetype-test.json
enable_lombok_support=false
enable_docker_support=false
config_file_format=1
enable_binding_external_properties=false
enable_default_binding_external_properties=false
enable_list_binding_external_properties=false
enable_map_binding_external_properties=false
enable_binding_external_properties_tests=false
binding_external_properties_mutability=none
enable_binding_external_properties_validation=false
enable_logback_support=false
logback_console_type=1
enable_logback_appender_smtp=false
enable_logback_appender_file=false
enable_api_cpanel_elk_log_system=false
enable_jwt_authentication=false
show_archetype_post_generate_log=true
extra_pom_dependencies=false
enable_folder_src_test_java=false
llm_prompt_language=pt
project_i18n_language=pt